<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>ISBN Reader</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📚%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <!-- Apply a saved light/dark override before first paint, so there is no flash of the wrong theme. -->
  <script>
    try {
      var saved = localStorage.getItem('isbn-reader.theme');
      if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
    } catch (e) {}
  </script>
</head>
<body>
  <main>
    <div class="top">
      <h1>ISBN Reader</h1>
      <button type="button" id="theme" title="Theme: follows the device, or force light or dark">🌓 Auto</button>
    </div>
    <form id="search">
      <input id="isbn" type="text" placeholder="ISBN, e.g. 978-0-14-032872-1" autocomplete="off" autofocus>
      <button type="submit">Search</button>
      <button type="button" id="scan">Scan</button>
      <label class="keep" title="Mark every scanned book automatically, so the Mark button is not needed">
        <input type="checkbox" id="auto-mark"> Auto-mark
      </label>
      <label class="keep" title="Keep the camera on and mark each book as it is scanned (needs Auto-mark)">
        <input type="checkbox" id="keep-scanning"> Keep scanning
      </label>
    </form>
    <div id="recent" class="recent" hidden></div>
    <div id="scanner" hidden>
      <video id="preview" playsinline muted></video>
      <p class="meta">Point the camera at the barcode on the back cover. Can't scan? Stop the camera and type the ISBN.</p>
    </div>
    <p id="status" role="status"></p>
    <section id="result"></section>
    <details id="marked" class="marked">
      <summary>Marked (<span id="marked-count">0</span>)</summary>
      <p id="marked-empty" class="meta">Nothing marked yet. Press "Mark" on a book, or turn on "Auto-mark" and scan some barcodes.</p>
      <ul id="marked-list"></ul>
      <div class="marked-actions">
        <button type="button" id="copy-marked">Copy list</button>
        <button type="button" id="download-marked">Download JSON</button>
        <button type="button" id="clear-marked">Clear</button>
      </div>
    </details>
  </main>
  <div id="snap" aria-hidden="true"></div>
  <script type="module" src="src/app.js"></script>
</body>
</html>
