name = "isbn-lookup"
main = "index.js"
compatibility_date = "2026-10-01"

# At most 20 lookups of new ISBNs per 10 seconds from one address (answers served from the cache are not counted).
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 10

# At most 30 usage-event batches per minute from one address.
[[ratelimits]]
name = "EVENT_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 30
  period = 60

# Usage events are kept in D1 (see README.md for the three commands that make it); without it POST /event just drops them.
[[d1_databases]]
binding = "DB"
database_name = "isbn-stats"
database_id = "46341b98-5fac-468c-816c-82cbf826549c"
