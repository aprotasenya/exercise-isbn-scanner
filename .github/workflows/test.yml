name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Syntax check
        run: for f in src/*.js; do node --check "$f"; done
      - name: Tests
        run: npm test
